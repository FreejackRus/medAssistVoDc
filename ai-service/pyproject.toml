[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medassistant-ai"
version = "2.0.0"
description = "AI service for medical assistant — LLM, RAG, PDF processing"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "ollama>=0.4.0",
    "chromadb>=1.0.0",
    "pydantic-settings>=2.7.0",
    "PyMuPDF>=1.25.0",
    "reportlab>=4.2.0",
    "markdown>=3.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 100
