services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai-service:
    build: ./ai-service
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    env_file: .env.docker.dev
    volumes:
      - ./ai-service/src:/app/src
      - ./data:/app/data:ro
      - ai_storage:/app/storage
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file: .env.docker.dev
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - ai-service

volumes:
  ollama_data:
  ai_storage:
  backend_storage:
